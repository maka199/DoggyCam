<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoggyCam - Viewer Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            text-align: center;
            font-size: 1.5rem;
        }
        
        .connection-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            z-index: 200;
        }
        
        .form-group {
            margin: 1rem 0;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }
        
        .btn-connect {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }
        
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }
        
        .btn-connect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            position: fixed;
            top: 70px;
            left: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            border-radius: 10px;
            z-index: 90;
            text-align: center;
            display: none;
        }
        
        .connection-status {
            font-size: 0.9rem;
            padding: 0.5rem;
            border-radius: 20px;
            display: inline-block;
            margin: 0.25rem;
        }
        
        .status-connecting {
            background: #ffa726;
        }
        
        .status-connected {
            background: #4caf50;
        }
        
        .status-disconnected {
            background: #f44336;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;
        }
        
        .btn-disconnect {
            background: #f44336;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        
        .loading {
            text-align: center;
            font-size: 1.2rem;
            padding: 2rem;
            display: none;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            display: none;
        }

        .instruction {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👀 DoggyCam Viewer</h1>
    </div>
    
    <div class="connection-form" id="connectionForm">
        <h2>Connect to Monitor</h2>
        <div class="form-group">
            <label for="roomIdInput">Enter Room ID:</label>
            <input type="text" id="roomIdInput" placeholder="e.g., abc123-def456" autofocus>
        </div>
        <div class="error-message" id="errorMessage"></div>
        <button class="btn btn-connect" id="connectBtn" onclick="connectToRoom()">
            🔗 Connect
        </button>
        <div class="instruction">
            Get the Room ID from the Monitor Device
        </div>
    </div>
    
    <div class="status" id="status">
        <div class="connection-status" id="connectionStatus">Connecting...</div>
        <div id="roomInfo"></div>
        <div id="monitorListContainer" style="margin-top:1rem; display:none;">
            <label for="monitorList">Select monitor(s):</label>
            <div id="monitorList"></div>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <!-- Multiple video elements will be added here -->
        <div class="loading" id="loading">
            <div>📡 Connecting to monitor...</div>
        </div>
    </div>

    <div class="controls" style="display: none;" id="controls">
        <button class="btn-disconnect" onclick="disconnect()">
            ❌ Disconnect
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let peerConnections = {}; // monitorId -> RTCPeerConnection
        let streams = {}; // monitorId -> MediaStream
    let selectedMonitors = [];
    let focusMonitorId = null;
        let availableMonitors = [];
        let roomId = null;
        let isConnected = false;

        // DOM elements
        const connectionForm = document.getElementById('connectionForm');
        const roomIdInput = document.getElementById('roomIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const status = document.getElementById('status');
        const connectionStatus = document.getElementById('connectionStatus');
        const roomInfo = document.getElementById('roomInfo');
        const loading = document.getElementById('loading');
        const controls = document.getElementById('controls');
        const errorMessage = document.getElementById('errorMessage');
        const monitorListContainer = document.getElementById('monitorListContainer');
        const monitorList = document.getElementById('monitorList');
        const videoContainer = document.getElementById('videoContainer');

        // WebRTC configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Check for room ID in URL parameters
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlRoomId = urlParams.get('room');
            if (urlRoomId) {
                roomIdInput.value = urlRoomId;
                // Auto-connect if room ID is in URL
                setTimeout(() => connectToRoom(), 500);
            }
        });

        // Socket event handlers
        socket.on('viewer-registered', (data) => {
            console.log('Registered as viewer for room:', data.roomId);
            connectionForm.style.display = 'none';
            status.style.display = 'block';
            loading.style.display = 'block';
            roomInfo.textContent = `Room: ${data.roomId}`;
            connectionStatus.textContent = 'Waiting for monitor(s)';
            connectionStatus.className = 'connection-status status-connecting';
            if (data.monitors && data.monitors.length > 0) {
                availableMonitors = data.monitors;
                // Anslut automatiskt till alla monitorer
                availableMonitors.forEach(monitorId => {
                    if (!selectedMonitors.includes(monitorId)) {
                        selectedMonitors.push(monitorId);
                        socket.emit('request-offer', { monitorId });
                    }
                });
                showMonitorList();
            }
        });

        socket.on('monitors-updated', (data) => {
            availableMonitors = data.monitors || [];
            // Anslut automatiskt till nya monitorer
            availableMonitors.forEach(monitorId => {
                if (!selectedMonitors.includes(monitorId)) {
                    selectedMonitors.push(monitorId);
                    socket.emit('request-offer', { monitorId });
                }
            });
            // Ta bort video för monitorer som inte längre finns
            Object.keys(streams).forEach(monitorId => {
                if (!availableMonitors.includes(monitorId)) {
                    removeVideoElement(monitorId);
                }
            });
            showMonitorList();
        });

        socket.on('offer', (data) => {
            const monitorId = data.from;
            if (!selectedMonitors.includes(monitorId)) return;
            handleOffer(monitorId, data.offer);
        });

        socket.on('ice-candidate', (data) => {
            const monitorId = data.from;
            if (peerConnections[monitorId]) {
                peerConnections[monitorId].addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        // Om en monitor försvinner, ta bort dess video
        // (monitors-updated hanterar detta)

        socket.on('error', (data) => {
            showError(data.message);
            connectBtn.disabled = false;
            connectBtn.textContent = '🔗 Connect';
        });

        // WebRTC functions
        async function handleOffer(monitorId, offer) {
            try {
                if (peerConnections[monitorId]) {
                    peerConnections[monitorId].close();
                }
                const pc = new RTCPeerConnection(rtcConfig);
                peerConnections[monitorId] = pc;

                // Handle incoming video stream
                pc.ontrack = (event) => {
                    if (!streams[monitorId]) {
                        streams[monitorId] = event.streams[0];
                        addVideoElement(monitorId, event.streams[0]);
                    }
                };

                // Handle ICE candidates
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('ice-candidate', {
                            candidate: event.candidate,
                            to: monitorId
                        });
                    }
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                        removeVideoElement(monitorId);
                        if (peerConnections[monitorId]) {
                            peerConnections[monitorId].close();
                            delete peerConnections[monitorId];
                        }
                        delete streams[monitorId];
                    }
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('answer', { answer, to: monitorId });

                loading.style.display = 'none';
                controls.style.display = 'flex';
                connectionStatus.textContent = 'Connected - Streaming';
                connectionStatus.className = 'connection-status status-connected';
                isConnected = true;
            } catch (error) {
                console.error('Error handling offer:', error);
                showError('Failed to establish video connection');
            }
        }

        // Connection controls
        function connectToRoom() {
            const inputRoomId = roomIdInput.value.trim();
            if (!inputRoomId) {
                showError('Please enter a Room ID');
                return;
            }

            roomId = inputRoomId;
            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            hideError();

            // Register as viewer
            socket.emit('register-viewer', { roomId });
        }

        function showMonitorList() {
            // Rensa gamla
            monitorList.innerHTML = '';
            if (!availableMonitors || availableMonitors.length === 0) {
                monitorListContainer.style.display = 'none';
                return;
            }
            monitorListContainer.style.display = 'block';
            // Skapa "fokus"-knappar för varje monitor
            availableMonitors.forEach(monitorId => {
                const btn = document.createElement('button');
                btn.textContent = focusMonitorId === monitorId ? 'Visa alla' : 'Fokusera';
                btn.style.marginRight = '0.5em';
                btn.onclick = () => {
                    if (focusMonitorId === monitorId) {
                        focusMonitorId = null;
                        updateVideoFocus();
                        showMonitorList();
                    } else {
                        focusMonitorId = monitorId;
                        updateVideoFocus();
                        showMonitorList();
                    }
                };
                const label = document.createElement('span');
                label.textContent = ' ' + monitorId.substring(0, 8);
                monitorList.appendChild(btn);
                monitorList.appendChild(label);
            });
        }

        function updateVideoFocus() {
            Object.keys(streams).forEach(monitorId => {
                let video = document.getElementById('video-' + monitorId);
                if (video) {
                    if (focusMonitorId && focusMonitorId !== monitorId) {
                        video.style.display = 'none';
                    } else {
                        video.style.display = 'inline-block';
                        video.style.width = focusMonitorId ? '96vw' : '48%';
                        video.style.height = focusMonitorId ? '80vh' : '48%';
                        video.style.margin = focusMonitorId ? 'auto' : '1%';
                    }
                }
            });
        }

        // selectMonitor och deselectMonitor behövs ej längre (automatisk anslutning)

        function addVideoElement(monitorId, stream) {
            let video = document.getElementById('video-' + monitorId);
            if (!video) {
                video = document.createElement('video');
                video.id = 'video-' + monitorId;
                video.autoplay = true;
                video.playsInline = true;
                video.style.width = '48%';
                video.style.height = '48%';
                video.style.margin = '1%';
                video.style.background = '#222';
                video.onclick = () => {
                    if (focusMonitorId === monitorId) {
                        focusMonitorId = null;
                    } else {
                        focusMonitorId = monitorId;
                    }
                    updateVideoFocus();
                    showMonitorList();
                };
                videoContainer.appendChild(video);
            }
            video.srcObject = stream;
            updateVideoFocus();
        }

        function removeVideoElement(monitorId) {
            let video = document.getElementById('video-' + monitorId);
            if (video) {
                video.srcObject = null;
                video.remove();
            }
        }

        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            remoteVideo.srcObject = null;
            
            connectionForm.style.display = 'block';
            status.style.display = 'none';
            loading.style.display = 'none';
            controls.style.display = 'none';
            
            connectBtn.disabled = false;
            connectBtn.textContent = '🔗 Connect';
            roomIdInput.value = '';
            isConnected = false;
            roomId = null;

            // Remove room parameter from URL
            const url = new URL(window.location);
            url.searchParams.delete('room');
            window.history.replaceState({}, document.title, url.pathname);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Handle Enter key in room ID input
        roomIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                connectToRoom();
            }
        });

        // Hantera request-offer från viewer till monitor
        socket.on('connect', () => {
            // Lyssna på request-offer eventet
            socket.on('request-offer', (data) => {
                // Gör inget här, detta är för monitor-sidan
            });
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (isConnected) {
                disconnect();
            }
        });
    </script>
</body>
</html>
