<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoggyCam - Viewer Device</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; }
        .header { text-align: center; margin-top: 2rem; }
        .connection-form { text-align: center; margin: 2rem; }
        .status { text-align: center; margin: 1rem; }
        .video-container { display: flex; justify-content: center; align-items: center; height: 60vh; }
        #monitor-video { width: 80vw; max-width: 600px; background: #000; border-radius: 10px; }
        .controls { text-align: center; margin: 2rem; }
        .error-message { color: #fff; background: #f44336; padding: 1rem; border-radius: 10px; margin: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👀 DoggyCam Viewer</h1>
    </div>
    <div class="connection-form" id="connectionForm">
        <h2>Connect to Monitor</h2>
        <input type="text" id="roomIdInput" placeholder="Enter Room ID" autofocus>
        <button id="connectBtn" onclick="connectToRoom()">🔗 Connect</button>
        <div class="error-message" id="errorMessage"></div>
    </div>
    <div class="status" id="status" style="display:none;">
        <div class="connection-status" id="connectionStatus">Connecting...</div>
        <div id="roomInfo"></div>
    </div>
    <div class="video-container" id="videoContainer"></div>
    <div class="controls" id="controls" style="display:none;">
        <button onclick="disconnect()">❌ Disconnect</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();
    let roomId = null;
    let pc = null;
    let stream = null;
    const connectionForm = document.getElementById('connectionForm');
    const roomIdInput = document.getElementById('roomIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const status = document.getElementById('status');
    const connectionStatus = document.getElementById('connectionStatus');
    const roomInfo = document.getElementById('roomInfo');
    const loading = null;
    const controls = document.getElementById('controls');
    const errorMessage = document.getElementById('errorMessage');
    const videoContainer = document.getElementById('videoContainer');
    const rtcConfig = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ] };

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlRoomId = urlParams.get('room');
        if (urlRoomId) {
            roomIdInput.value = urlRoomId;
            setTimeout(() => connectToRoom(), 500);
        }
    });
    socket.on('viewer-registered', (data) => {
        connectionForm.style.display = 'none';
        status.style.display = 'block';
        roomInfo.textContent = `Room: ${data.roomId}`;
        connectionStatus.textContent = 'Waiting for monitor...';
        connectionStatus.className = 'connection-status status-connecting';
    });
    socket.on('offer', (data) => { handleOffer(data.offer); });
    socket.on('ice-candidate', (data) => { if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate)); });
    socket.on('error', (data) => { showError(data.message); connectBtn.disabled = false; });
    async function handleOffer(offer) {
        try {
            if (pc) pc.close();
            pc = new RTCPeerConnection(rtcConfig);
            pc.ontrack = (event) => {
                if (!stream) {
                    stream = event.streams[0];
                    addVideoElement(stream);
                }
            };
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, roomId, sender: 'viewer' });
                }
            };
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { answer, roomId });
        } catch (error) { showError('Failed to connect to monitor.'); }
    }
    function addVideoElement(stream) {
        const video = document.createElement('video');
        video.id = 'monitor-video';
        video.autoplay = true;
        video.playsInline = true;
        video.srcObject = stream;
        video.className = 'monitor-video';
        videoContainer.appendChild(video);
        controls.style.display = 'block';
    }
    function connectToRoom() {
        roomId = roomIdInput.value.trim();
        if (!roomId) { showError('Please enter a Room ID.'); return; }
        connectBtn.disabled = true;
        socket.emit('register-viewer', { roomId });
    }
    function disconnect() { window.location.reload(); }
    function showError(msg) { errorMessage.textContent = msg; errorMessage.style.display = 'block'; }
    </script>
</body>
</html>
