<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoggyCam - Monitor Device</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: Arial, sans-serif; }
        .header { text-align: center; margin-top: 2rem; }
        .status { text-align: center; margin: 1rem; }
        .video-container { display: flex; justify-content: center; align-items: center; height: 60vh; }
        #localVideo { width: 80vw; max-width: 600px; background: #000; border-radius: 10px; }
        .controls { text-align: center; margin: 2rem; }
        .qr-container { text-align: center; margin: 2rem; }
        .qr-code { font-size: 1.5rem; margin: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐕 DoggyCam Monitor</h1>
    </div>
    <div class="status">
        <div class="room-id" id="roomId">Connecting...</div>
        <div class="connection-status" id="connectionStatus">Initializing</div>
    </div>
    <div class="qr-container" id="qrContainer" style="display: none;">
        <h3>Share this Room ID:</h3>
        <div class="qr-code" id="qrCode"></div>
        <p>Or visit: <span id="viewerUrl"></span></p>
    </div>
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div class="controls">
        <button id="startBtn" onclick="startMonitoring()">▶️ Start</button>
        <button id="stopBtn" onclick="stopMonitoring()" style="display: none;">⏹️ Stop</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();
    let roomId = null;
    let localStream = null;
    let pc = null;
    const localVideo = document.getElementById('localVideo');
    const roomIdElement = document.getElementById('roomId');
    const connectionStatus = document.getElementById('connectionStatus');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const qrContainer = document.getElementById('qrContainer');
    const viewerUrl = document.getElementById('viewerUrl');
    const rtcConfig = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ] };

    socket.on('monitor-registered', (data) => {
        roomId = data.roomId;
        roomIdElement.textContent = `Room ID: ${roomId}`;
        connectionStatus.textContent = 'Waiting for viewer...';
        qrContainer.style.display = 'block';
        const baseUrl = window.location.origin;
        const fullUrl = `${baseUrl}/view?room=${roomId}`;
        viewerUrl.textContent = fullUrl;
        document.getElementById('qrCode').innerHTML = `<strong>${roomId}</strong>`;
    });

    socket.on('answer', (data) => {
        if (pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    });
    socket.on('ice-candidate', (data) => {
        if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    });
    socket.on('viewer-registered', () => {
        createOffer();
        connectionStatus.textContent = 'Broadcasting';
    });

    async function startMonitoring() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            socket.emit('register-monitor', {});
        } catch (error) {
            alert('Could not access camera: ' + error.message);
        }
    }
    async function createOffer() {
        pc = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice-candidate', { candidate: event.candidate, roomId, sender: 'monitor' });
            }
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { offer, roomId });
    }
    function stopMonitoring() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (pc) { pc.close(); pc = null; }
        localVideo.srcObject = null;
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
        qrContainer.style.display = 'none';
        connectionStatus.textContent = 'Stopped';
    }
    window.addEventListener('load', () => { setTimeout(startMonitoring, 500); });
    window.addEventListener('beforeunload', stopMonitoring);
    </script>
</body>
</html>
