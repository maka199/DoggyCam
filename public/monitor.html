<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoggyCam - Monitor Device</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            text-align: center;
            font-size: 1.5rem;
        }
        
        .status {
            position: fixed;
            top: 70px;
            left: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            border-radius: 10px;
            z-index: 90;
            text-align: center;
        }
        
        .room-id {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 0.5rem;
        }
        
        .connection-status {
            font-size: 0.9rem;
            padding: 0.5rem;
            border-radius: 20px;
            display: inline-block;
            margin: 0.25rem;
        }
        
        .status-connecting {
            background: #ffa726;
        }
        
        .status-connected {
            background: #4caf50;
        }
        
        .status-disconnected {
            background: #f44336;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 100;
        }
        
        .btn {
            padding: 1rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: #4caf50;
            color: white;
        }
        
        .btn-stop {
            background: #f44336;
            color: white;
        }
        
        .btn:hover {
            transform: scale(1.1);
        }
        
        .loading {
            text-align: center;
            font-size: 1.2rem;
            padding: 2rem;
        }

        .qr-container {
            position: fixed;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 10px;
            z-index: 100;
            text-align: center;
            color: #333;
        }

        .qr-code {
            margin: 0.5rem 0;
        }

        @media (max-width: 768px) {
            .qr-container {
                position: static;
                margin: 1rem;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐕 DoggyCam Monitor</h1>
    </div>
    
    <div class="status" id="status">
        <div class="room-id" id="roomId">Connecting...</div>
        <div class="connection-status status-connecting" id="connectionStatus">Initializing</div>
        <div id="viewerCount">0 viewers connected</div>
    </div>

    <div class="qr-container" id="qrContainer" style="display: none;">
        <h3>Share this Room ID:</h3>
        <div class="qr-code" id="qrCode"></div>
        <p>Or visit: <span id="viewerUrl"></span></p>
    </div>
    
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="loading" id="loading">
            <div>📹 Starting camera...</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-start" id="startBtn" onclick="startMonitoring()">▶️</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopMonitoring()" style="display: none;">⏹️</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('connect', () => {
            console.log('[Socket.IO] Connected to server, socket id:', socket.id);
        });
        socket.on('disconnect', (reason) => {
            console.warn('[Socket.IO] Disconnected from server:', reason);
        });
        socket.on('connect_error', (err) => {
            console.error('[Socket.IO] Connection error:', err);
        });
    console.log('[Socket.IO] Sent register-monitor for room:', roomId, 'monitorId:', monitorId);
        let localStream = null;
        let peerConnections = new Map();
        let roomId = null;
        let isMonitoring = false;

        // DOM elements
        const localVideo = document.getElementById('localVideo');
        const loading = document.getElementById('loading');
        const roomIdElement = document.getElementById('roomId');
        const connectionStatus = document.getElementById('connectionStatus');
        const viewerCount = document.getElementById('viewerCount');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const qrContainer = document.getElementById('qrContainer');
        const viewerUrl = document.getElementById('viewerUrl');

        // WebRTC configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Socket event handlers
        // Hantera request-offer från viewer (split screen)
        socket.on('request-offer', async (data) => {
            const viewerId = data.viewerId;
            console.log('[MONITOR] Fick request-offer från viewer:', viewerId);
            if (!viewerId) return;
            await createPeerConnectionToViewer(viewerId);
        });

        // Skapa peer connection mot specifik viewer (för split screen)
        async function createPeerConnectionToViewer(viewerId) {
            console.log('[MONITOR] Skapar peer connection till viewer:', viewerId);
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections.set(viewerId, pc);

            // Add local stream to peer connection
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('[MONITOR] Skickar ICE-candidate till viewer:', viewerId, event.candidate);
                    socket.emit('ice-candidate', {
                        candidate: event.candidate,
                        to: viewerId
                    });
                }
            };

            // Create and send offer
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                console.log('[MONITOR] Skickar offer till viewer:', viewerId);
                socket.emit('offer', { offer, to: viewerId });
            } catch (error) {
                console.error('Error creating offer:', error);
            }
        }
        socket.on('monitor-registered', (data) => {
            roomId = data.roomId;
            roomIdElement.textContent = `Room ID: ${roomId}`;
            connectionStatus.textContent = 'Waiting for viewers';
            connectionStatus.className = 'connection-status status-connecting';
            
            // Show QR code container with room info
            qrContainer.style.display = 'block';
            const baseUrl = window.location.origin;
            const fullUrl = `${baseUrl}/view?room=${roomId}`;
            viewerUrl.textContent = fullUrl;
            document.getElementById('qrCode').innerHTML = `<strong>${roomId}</strong>`;
        });



        socket.on('viewer-left', (data) => {
            console.log('Viewer left:', data.viewerId);
            if (peerConnections.has(data.viewerId)) {
                peerConnections.get(data.viewerId).close();
                peerConnections.delete(data.viewerId);
            }
            updateConnectionStatus();
        });

        socket.on('answer', (data) => {
            const pc = peerConnections.get(data.from);
            if (pc) {
                pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', (data) => {
            const pc = peerConnections.get(data.from);
            if (pc) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });



        function updateConnectionStatus() {
            const connectedViewers = peerConnections.size;
            viewerCount.textContent = `${connectedViewers} viewer${connectedViewers !== 1 ? 's' : ''} connected`;
            
            if (connectedViewers > 0) {
                connectionStatus.textContent = 'Broadcasting';
                connectionStatus.className = 'connection-status status-connected';
            } else {
                connectionStatus.textContent = 'Waiting for viewers';
                connectionStatus.className = 'connection-status status-connecting';
            }
        }

        // Monitoring controls
        async function startMonitoring() {
            try {
                loading.style.display = 'block';
                
                // Request camera access
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'environment' // Use back camera on mobile
                    },
                    audio: true
                });

                localVideo.srcObject = localStream;
                loading.style.display = 'none';
                
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                isMonitoring = true;

                // Register as monitor
                socket.emit('register-monitor', {});

            } catch (error) {
                console.error('Error accessing camera:', error);
                loading.innerHTML = '<div>❌ Camera access denied or not available</div>';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 3000);
            }
        }

        function stopMonitoring() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            localVideo.srcObject = null;
            
            // Close all peer connections
            peerConnections.forEach(pc => pc.close());
            peerConnections.clear();
            
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            isMonitoring = false;
            
            qrContainer.style.display = 'none';
            connectionStatus.textContent = 'Stopped';
            connectionStatus.className = 'connection-status status-disconnected';
            viewerCount.textContent = '0 viewers connected';
        }

        // Auto-start monitoring when page loads
        window.addEventListener('load', () => {
            setTimeout(startMonitoring, 1000);
        });

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            stopMonitoring();
        });
    </script>
</body>
</html>
